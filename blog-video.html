<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="pictures/Earth.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth - BLOG - VIDEO</title>
    <style>
        :root{
            --cursor: url(icon/earth-cursor-hand.png), auto;
            ---cursor: url(icon/icon-text.png), text;
        }
        *{
            margin: 0;
        }
        body{
            background-image: url(pictures/back-earth.jpg);
            background-size: cover;
            color: #C5C6C7;
            position: fixed;
            width: 100%;
            height: 100%;
            cursor: url(icon/earth-cursor.png), auto;
        }
        .header{
            justify-content: center;
            display: flex;
            background-color: none;
            width: 100%;
            padding: 50px;
            
        }
        .div-head{
            width: calc(100%/3);
            height: 100%;
        }
        .link-center{
            text-decoration: none;
            color: #66FCF1;
            text-shadow: 1px 3px 19px #66FCF1;
            margin: 3%;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            transition: all ease-out 1.3s;
        }
        .link-center:hover{
            text-shadow: 0 1px 30px #66FCF1;
            transform: scale(1.1);
            border-radius: 10px ;
            padding: 8px;
            box-shadow: 0 3px 40px #66FCF1;

        }
        img{
            width: 60px;
            box-shadow: 0 3px 40px #66FCF1;
            border-radius: 50%;
            padding: 3px;
            transition: all ease-out 1.3s;
        }
        img:hover{
            box-shadow:  0 1px 50px #66FCF1;
            transform: scale(1.1);
        }
        .input-btn-login-head{
            background: none;
            text-align: center;
            box-shadow:  0 1px 20px #66FCF1;
            padding: 10px;
            width: 23%;
            border: none;
            border-radius: 50% 10% 50% 10% / 10% 50% 10% 50% ;
            font-size: 17px;
            top: 50%;
            left: 50%;
            transform: translate(+270%, -10%);
            color: #66fcf2a2;
            transition: all ease-out 1.3s;
        }
        .input-btn-login-head:hover{
            color: #66FCF1;
            box-shadow:  0 3px 60px #66FCF1;
            cursor: pointer;
        }
        .main{
            overflow: auto;
            text-align: center;
            width: 100%;
            height: 66%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        h1{
            top: 50%;
            left: 50%;
            transform: translate(0, -100%);
            text-align: center;
            border-radius: 100%;
            text-shadow: 0 1px 10px #66FCF1;
            font-size: 300%;
            font-family: 'Times New Roman', Times, serif;
            padding: .3%;
            
        }
        h2{
            margin: 5% 0 2% 0;
            text-shadow: 0 1px 10px #C5C6C7;
            
        }
        .earth-video-center{
            width: 40%;
            margin-bottom: 2%;
            border: none;
            border-radius: 5%;
            transition: all ease-out 1.3s;
        }
        .earth-video-center:hover{
            cursor: pointer;
            box-shadow:  0 2px 50px #66FCF1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="div-head">
            <a href="home.html" class="logo">
                <img src="pictures/Earth.png" alt="" srcset="">
            </a>
        </div>
        <div class="div-head" style="direction: ltr;">
            <a href="home.html" class="link-center">HOME</a>
            <a href="blog.html" class="link-center">BLOG</a>
            <a href="ABOUT US.html" class="link-center">ABOUT US</a>
            <a href="Support.html" class="link-center">SUPPORT</a>
        </div>
        <div class="div-head">
            <form action="">
                <a href="login.html"><input type="button" value="Sign in" class="input-btn-login-head"></a>
            </form>
        </div>
    </div>
    <h1>5 PART VIDEOS EARTH</h1>
    <div class="main">
        <h2>( - - PART 1 - - )</h2>
        <video src="video/earth.mp4" class="earth-video-center" controls></video><br>
        <h2>( - - PART 2 - - )</h2>
        <video src="video/earth2.mp4" class="earth-video-center" controls></video><br>
        <h2>( - - PART 3 - - )</h2>
        <video src="video/earth3.mp4" class="earth-video-center" controls></video><br>
        <h2>( - - PART 4 - - )</h2>
        <video src="video/earth4.mp4" class="earth-video-center" controls></video><br>
        <h2>( - - PART 5 - - )</h2>
        <video src="video/earth5.mp4" class="earth-video-center" controls></video><br>
    </div>
</body>
</html>
